<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" type="image/svg+xml" href="profiles/icons/icon.svg" />
  <style>html,body{margin:0;background:#0a0a0b;color:#9a9aa2;font:14px -apple-system,Segoe UI,Roboto,sans-serif}a{color:#e0263f}.w{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:16px}</style>
  <script>
    // Opens the tool used last on this computer. Old links like /#/p/<id> belong to Profiles.
    (function () {
      var last = null;
      try { last = localStorage.getItem("grc-last-tool"); } catch (e) {}
      var hash = location.hash;
      var dest = hash && hash.length > 2 ? "profiles/" : last === "crm" ? "crm/" : "profiles/";
      location.replace(dest + hash);
    })();
  </script>
</head>
<body><div class="w"><a href="profiles/">Continue</a></div></body>
</html>
