name: Supabase keep-alive

# Free Supabase projects pause after about a week with no activity.
# This pings the database once a day so the tool stays awake.
on:
  schedule:
    - cron: "17 13 * * *" # daily, ~8am Central
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping Supabase
        run: |
          URL=$(grep -oP 'SUPABASE_URL = "\K[^"]+' profiles/js/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY = "\K[^"]+' profiles/js/config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded $code"
          test "$code" = "200"
